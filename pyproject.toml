[project]
name = "jogo-do-advogado"
version = "0.1.0"
description = "API do Jogo do Advogado (Django + Django Ninja)"
requires-python = ">=3.12"

dependencies = [
    "django==6.1.1",
    "django-environ>=0.14.0",
    "django-ninja>=1.1.0",
    "django-ninja-jwt>=5.3.0",
    "gunicorn>=26.2.0",
    "pillow>=10.0",
    "psycopg[binary]>=3.1",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-debug-toolbar",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = [
    "tests_*.py",
    "*_test.py",
    "tests.py",
]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]

[tool.coverage.run]
branch = true
source = [
    "apps",
]
omit = [
    "*/migrations/*",
    "*/admin.py",
    "*/apps.py",
    "*/management/*",
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
show_missing = true
skip_covered = true
fail_under = 80

[tool.coverage.html]
directory = "htmlcov"
